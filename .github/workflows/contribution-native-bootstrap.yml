name: Validate native SDK test environment
on:
  push:
    branches: [validation/native-sdk-bootstrap-20261112]
permissions:
  contents: read
jobs:
  sdk-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 873008dead495e215a51dbea5c705bc19b61016d
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
      - name: Generate the official SDK
        run: |
          python -m pip install -r cvat-sdk/gen/requirements.txt
          ./cvat-sdk/gen/generate.sh
      - name: Install native SDK and test dependencies
        run: python -m pip install -e './cvat-sdk[masks]' -e ./cvat-cli -r tests/python/requirements.txt
      - name: Run existing SDK unit controls
        run: |
          set -o pipefail
          python -m pytest tests/python/sdk/test_masks.py tests/python/sdk/test_attributes.py --no-services --no-coverage-collection -q 2>&1 | tee native-bootstrap.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-sdk-bootstrap
          path: native-bootstrap.log
